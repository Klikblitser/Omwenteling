<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
  <script src="{{ '/assets/js/script.js' | relative_url }}"></script>

{% seo %}

  {% include head-custom.html %}
</head>

<body>

  <div class="ribbon">
    <div class="ribbon-inner">
      <span class="ribbon-text">Iedereen welkom bij onze informatiebijeenkomsten &amp; workshops</span>
      <a href="{{ '/another-page.html' | relative_url }}" class="cta">Doe mee</a>
    </div>
  </div>

  <header>
    <h1 class="title">{{ site.title | default: site.github.repository_name }}</h1>
    <p class="tagline">{{ site.description | default: site.github.project_tagline }}</p>
  </header>

  <div id="main" role="main">
    <article class="markdown-body">
      {{ content }}
    </article>
  </div>

  <footer>
    <p>Een initiatief van <a href="https://www.vbbskw.com">VBBSKW</a>.</p>
  </footer>

  <div class="current-section">
    <a href="#top">Naar boven ↑</a>
    <p class="name"></p>
  </div>
</body>
</html>
