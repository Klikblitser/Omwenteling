<!-- Setup Google Analytics -->
{% include head-custom-google-analytics.html %}

<!-- Tabbladpictogram: de logo-O. favicon.ico bevat 16, 32 en 48 pixels met
     een doorzichtige achtergrond, zodat hij op een licht en een donker
     tabblad allebei leesbaar is. Beide bestanden staan in de wortel van de
     site, waar browsers en iOS ze ook zonder deze regels zouden zoeken.
     Opnieuw maken: python3 tools/favicon.py -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

<!-- Componenten voor de burgerberaadpagina's. Alleen geladen op pagina's met
     "burgerberaad: true" in de front matter, zodat de rest van de site deze
     ~9 kB niet hoeft op te halen. -->
{% if page.burgerberaad %}
<link rel="stylesheet" href="{{ '/assets/css/burgerberaad.css' | relative_url }}">
{% endif %}

<!-- Leaflet voor de pagina's met een kaart. Lokaal geserveerd; het stond
     eerder op unpkg.com, wat het IP-adres van elke bezoeker naar een
     externe CDN stuurde. -->
{% if page.leaflet %}
<link rel="stylesheet" href="{{ '/assets/vendor/leaflet/1.9.4/leaflet.css' | relative_url }}">
{% endif %}

<!-- end custom head snippets -->
